name: 刷新个人主页动态资源

on:
  schedule:
    # 每天 UTC 01:23 更新一次
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-dynamic-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 根据公开贡献记录生成贪吃蛇 SVG
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 贪吃蛇 SVG 里没有坐标文字，按 GitHub 贡献图样式补上月份与星期标注。
      - name: 为贡献图添加月份与星期标注
        run: |
          python3 .agents/skills/designing-visuals/scripts/activity/add_labels.py \
            --light dist/github-contribution-grid-snake.svg \
            --dark dist/github-contribution-grid-snake-dark.svg

      # 统计卡与贪吃蛇共用同一次发布，避免两个 workflow 各自推送 output 时互相覆盖。
      - name: 生成账号统计与常用语言 SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .agents/skills/designing-visuals/scripts/stats/gen_stats.py \
            --owner "${{ github.repository_owner }}" \
            --output-dir dist

      # 发布前确认六个动态资源都生成且非空，避免用不完整的 dist 覆盖 output 分支。
      - name: 检查动态资源完整
        run: |
          set -euo pipefail
          for f in \
            dist/github-contribution-grid-snake.svg \
            dist/github-contribution-grid-snake-dark.svg \
            dist/github-stats.svg \
            dist/github-stats-dark.svg \
            dist/github-languages.svg \
            dist/github-languages-dark.svg; do
            if [ ! -s "$f" ]; then
              echo "::error::动态资源缺失或为空：$f"
              exit 1
            fi
          done
          echo "六个动态资源均已生成"

      - name: 发布到 output 分支
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore: 更新主页动态资源"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}