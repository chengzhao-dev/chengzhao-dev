name: 校验 README 生成结果

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      # 固定 Quarto 版本，保证这里的渲染结果和本地提交 README.md 时的版本一致。
      # 本地升级 Quarto 后，重新渲染并同步修改这里的版本号。
      - name: 安装 Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: 重新生成 README.md
        run: quarto render

      - name: 检查 README.md 与源文件一致
        run: |
          set -euo pipefail
          if ! git diff --quiet -- README.md; then
            echo "::error::README.md 与 index.qmd/content 不一致，请在本地执行 quarto render 后提交"
            git diff -- README.md
            exit 1
          fi
          echo "README.md 与源文件一致"

      # 与本地共用的结构断言：说明位置、无指标徽章、无表格、alt 与来源白名单。
      - name: 检查 README 结构断言
        run: python3 .agents/skills/verifying/scripts/verify/check_readme.py

      # agent 工作区注册表与生成物必须零漂移，否则检索速查表会指向过期内容。
      - name: 检查 agent 注册表零漂移
        run: python3 .agents/skills/governing-agents/scripts/registry.py check

      # Cursor 会自动注入 Co-authored-by，让 cursoragent 出现在 Contributors；
      # 这里断言 git 历史中没有任何 Cursor 归属。
      - name: 检查提交归属无 Cursor
        run: python3 .agents/skills/verifying/scripts/verify/check_commit_attribution.py

      # 审计是归类与死指针的非阻断巡检；当前零发现，作为门禁接入后可及早暴露漂移。
      - name: 审计 agent 工作区
        run: python3 .agents/skills/governing-agents/scripts/registry.py audit

      - name: 检查文档预算与命名规范
        run: |
          set -euo pipefail
          python3 .agents/skills/verifying/scripts/verify/check_budgets.py
          python3 .agents/skills/verifying/scripts/verify/check_naming.py

      - name: 检查工作流与配置静态规则
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 .agents/skills/verifying/scripts/verify/check_workflows.py

      - name: 检查 GitHub 发布面静态规则
        run: python3 .agents/skills/verifying/scripts/verify/check_publish.py

      # main 只发布 README.md，本地预览用的 HTML 产物不得进入版本库。
      - name: 检查没有提交 HTML 预览产物
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- '*.html' '*_files/*' '.quarto/*' 'README.html' 'README_files/*' 'index.html' 'index_files/*')
          if [ -n "$tracked" ]; then
            echo "::error::仓库中不应提交 HTML 预览或 Quarto 缓存产物，请从版本库移除后加入 .gitignore"
            echo "$tracked"
            exit 1
          fi
          echo "没有 HTML 预览产物被提交"

      - name: 检查 README.md 是合法 UTF-8
        run: |
          set -euo pipefail
          iconv -f UTF-8 -t UTF-8 README.md > /dev/null
          echo "README.md 是合法的 UTF-8"

      - name: 检查远程图片 URL 未被追加 .png
        run: |
          set -euo pipefail
          remote='img\.shields\.io|raw\.githubusercontent\.com'
          if grep -nE "$remote" README.md | grep -q '\.png'; then
            echo "::error::远程图片 URL 被追加了 .png 后缀，请改用原始 HTML 的 img 写法"
            grep -nE "$remote" README.md | grep '\.png'
            exit 1
          fi
          echo "远程图片 URL 正常"

      - name: 检查居中属性仍是 GitHub 支持的 align
        run: |
          set -euo pipefail
          if grep -n 'data-align' README.md; then
            echo "::error::README.md 中出现 data-align，GitHub 会丢弃该属性导致居中失效"
            exit 1
          fi
          echo "居中属性正常"

      - name: 检查图片都带有 alt 文本
        run: |
          set -euo pipefail
          if grep -nE '<img ' README.md | grep -v 'alt='; then
            echo "::error::存在缺少 alt 文本的图片"
            exit 1
          fi
          echo "所有图片都带有 alt 文本"

      # GitHub 统计卡只允许引用本仓库 output 分支自建的 SVG，不能出现第三方统计域名，
      # 也不能把引用指向别处。这里校验 README 中的动态资源引用是否符合生成约定：
      # output 分支下允许的六个文件名，且统计卡浅色/深色四张必须出现。
      - name: 检查动态资源引用 output 分支
        run: |
          set -euo pipefail
          # BRE 括号不转义，避免双引号变量里 \\( 变成字面量
          allowed='raw\.githubusercontent\.com/chengzhao-dev/chengzhao-dev/output/\(github-stats\|github-stats-dark\|github-languages\|github-languages-dark\|github-contribution-grid-snake\|github-contribution-grid-snake-dark\)\.svg'
          if grep -nE 'raw\.githubusercontent\.com' README.md | grep -v "$allowed"; then
            echo "::error::README.md 引用了 output 分支之外的资源"
            exit 1
          fi
          for f in github-stats github-stats-dark github-languages github-languages-dark; do
            if ! grep -qE "output/$f\.svg" README.md; then
              echo "::error::README.md 缺少对 output/$f.svg 的引用"
              exit 1
            fi
          done
          echo "动态资源引用正常"

      # README 顶部横幅依赖仓库内的 assets 资源。资源缺失或降级帧被删掉时，
      # GitHub 只会渲染成破图，而上面的生成一致性校验发现不了，因此在这里显式拦截。
      - name: 检查横幅资源存在
        run: |
          set -euo pipefail
          for f in assets/banner/pixel-flower-landscape-64color.webp assets/banner/pixel-flower-landscape-64color.png; do
            if [ ! -s "$f" ]; then
              echo "::error::缺少横幅资源 $f，README 顶部会显示破图"
              exit 1
            fi
          done
          echo "横幅资源存在"

      # 源素材是横幅唯一的再生依据，丢了就只能靠手改生成物，这里一并拦截。
      - name: 检查横幅源素材存在
        run: |
          set -euo pipefail
          for f in assets/source/pixel-flower-landscape/pixel-flower-landscape.mp4 \
                   assets/source/pixel-flower-landscape/pixel-flower-landscape.png; do
            if [ ! -s "$f" ]; then
              echo "::error::缺少横幅源素材 $f，横幅将无法重新生成"
              exit 1
            fi
          done
          echo "横幅源素材存在"

      # 生成与校验脚本都是横幅、README 和注册表唯一的维护入口，语法坏掉就等于再也改不动。
      # 这里只做语法检查，不执行脚本：执行会重写受控资源，而且需要本机的 FFmpeg。
      - name: 检查脚本可编译
        run: |
          set -euo pipefail
          python3 -m py_compile $(git ls-files '*.py')
          echo "全部 Python 脚本语法正常"

      # 横幅是「动画 WebP 优先 + 静态 PNG 降级」的 <picture> 结构。README 里少写一层、
      # 或者资源被换成非动画、尺寸不对、用色超标的文件，GitHub 上的效果都会悄悄变差，
      # 而这些用 grep 都查不出来，所以在这里用 Pillow 真正解码一次再断言。
      - name: 安装 Pillow
        run: python3 -m pip install --quiet --disable-pip-version-check pillow

      # 横幅规格与上限以 .agents/skills/designing-visuals/scripts/media/banner_spec.py 为唯一事实源，
      # 本地与 CI 调用同一实现；README 的 <picture> 结构断言已由 check_readme.py 覆盖。
      - name: 校验横幅媒体
        run: |
          set -euo pipefail
          python3 .agents/skills/designing-visuals/scripts/media/gen_banner.py --check

      - name: 检查空白字符问题
        run: |
          set -euo pipefail
          git diff --check
          echo "没有空白字符问题"